<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Phoenix Journey — One's Conversation With Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #ffffff;
            --card-bg: #fcfbf9;
            --text-dark: #1f1d1b;
            --text-muted: #66605b;
            --accent-flame: #d84315;
            --accent-glow: #e65100;
            --accent-gold: #b78103;
            --border-line: #eae4dc;
            --shadow-subtle: rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: 'Lora', serif;
            line-height: 1.85;
            overflow-x: hidden;
        }

        /* Reading Progress Bar */
        #progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(0,0,0,0.05);
            z-index: 1000;
        }
        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-flame), var(--accent-gold));
            width: 0%;
            transition: width 0.1s ease-out;
        }

        /* Hero Section */
        header {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            position: relative;
            background: radial-gradient(circle at center, #fff8f5 0%, var(--bg-light) 75%);
            border-bottom: 1px solid var(--border-line);
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--accent-flame);
            font-size: clamp(2.2rem, 6vw, 4rem);
            letter-spacing: 2px;
            margin-bottom: 12px;
            animation: fadeInDown 1.2s ease-out;
        }

        .subtitle {
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            color: var(--accent-gold);
            font-style: italic;
            margin-bottom: 8px;
            animation: fadeInUp 1.2s ease-out 0.2s backwards;
        }

        .author {
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            animation: fadeInUp 1.2s ease-out 0.4s backwards;
        }

        .publisher {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            color: var(--accent-glow);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 35px;
            animation: fadeInUp 1.2s ease-out 0.5s backwards;
        }

        /* Animated Flame Button */
        .cta-btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-flame), #bf360c);
            color: #ffffff;
            padding: 14px 34px;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(216, 67, 21, 0.25);
            transition: all 0.3s ease;
            animation: fadeInUp 1.2s ease-out 0.6s backwards;
        }

        .cta-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 25px rgba(216, 67, 21, 0.4);
            background: linear-gradient(135deg, #f4511e, var(--accent-flame));
        }

        /* Container & Cards */
        .container {
            max-width: 780px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .preface, .importance, .toc-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-line);
            border-left: 4px solid var(--accent-flame);
            padding: 35px;
            margin-bottom: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px var(--shadow-subtle);
        }

        .importance {
            border-left: 4px solid var(--accent-gold);
        }

        .chapter {
            background-color: var(--card-bg);
            border: 1px solid var(--border-line);
            padding: 40px;
            margin-bottom: 50px;
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-subtle);
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .chapter.visible {
            opacity: 1;
            transform: translateY(0);
        }

        h2 {
            font-family: 'Cinzel', serif;
            color: var(--accent-flame);
            font-size: 1.35rem;
            border-bottom: 1px solid var(--border-line);
            padding-bottom: 12px;
            margin-bottom: 24px;
        }

        p {
            margin-bottom: 20px;
            text-align: justify;
            color: var(--text-dark);
        }

        .dialogue {
            font-weight: 700;
            color: var(--accent-glow);
            margin-top: 25px;
            font-family: 'Cinzel', serif;
            letter-spacing: 0.5px;
        }

        /* Table of Contents Styling */
        .toc-list {
            list-style: none;
            padding: 0;
        }

        .toc-item {
            margin-bottom: 18px;
            border-bottom: 1px dashed var(--border-line);
            padding-bottom: 12px;
        }

        .toc-link {
            font-family: 'Cinzel', serif;
            color: var(--accent-flame);
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
            transition: color 0.3s ease, transform 0.2s ease;
        }

        .toc-link:hover {
            color: var(--accent-gold);
            transform: translateX(4px);
        }

        .toc-quote {
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding-left: 12px;
            border-left: 2px solid var(--accent-gold);
            margin-top: 4px;
        }

        footer {
